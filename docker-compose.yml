version: '3.8'

services:
  # Main BOTAIRDROP service
  botairdrop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: botairdrop-main
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=4096
      - LOG_LEVEL=info
      - MAX_WALLETS=100
      - RPC_URL=https://api.mainnet-beta.solana.com
      - JITO_RPC_URL=https://jito-rpc.com
      - PROXY_ENABLED=true
      - CAPTCHA_ENABLED=true
      - METRICS_ENABLED=true
    volumes:
      - ./logs:/app/logs
      - ./src/config:/app/src/config:ro
    networks:
      - botairdrop-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "node", "dist/scripts/health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Monitoring service (optional)
  botairdrop-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: botairdrop-monitor
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MODE=monitor
      - MONITOR_INTERVAL=5000
      - ALERT_THRESHOLD=10
    volumes:
      - ./logs:/app/logs
      - ./src/config:/app/src/config:ro
    networks:
      - botairdrop-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    depends_on:
      - botairdrop

  # Proxy health checker (optional)
  proxy-checker:
    image: alpine/curl:latest
    container_name: botairdrop-proxy-checker
    restart: unless-stopped
    volumes:
      - ./src/config/proxies.json:/app/proxies.json:ro
    networks:
      - botairdrop-network
    command: >
      sh -c "
        while true; do
          echo 'Checking proxy health...';
          for proxy in $$(jq -r '.[] | .host + ":" + .port' /app/proxies.json); do
            timeout 5 curl -x http://$$proxy -I https://httpbin.org/ip 2>/dev/null && \
              echo \"✓ $$proxy\" || \
              echo \"✗ $$proxy\"
          done;
          sleep 60;
        done
      "
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Prometheus for metrics (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: botairdrop-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - botairdrop-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: botairdrop-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - botairdrop-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - prometheus

networks:
  botairdrop-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  prometheus-data:
  grafana-data:
